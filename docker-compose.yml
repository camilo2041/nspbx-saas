# Docker NO rota los logs por defecto y crecen sin techo: en producción
# nspbx_freeswitch llegó a 8,4 GB y nspbx_backend a 3,9 GB, 12 GB de disco
# que nadie iba a reclamar. Esto topa cada contenedor en 250 MB (5 archivos
# de 50 MB) y descarta lo más viejo. Para conservar más historia, subí
# max-file, no max-size: rotar archivos grandes es más caro.
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nspbx_postgres
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nspbx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env (bash scripts/setup.sh lo genera)}
      POSTGRES_DB: ${POSTGRES_DB:-nspbx}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nspbx}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nspbx_net

  freeswitch:
    build: ./freeswitch
    container_name: nspbx_freeswitch
    logging: *logging
    restart: unless-stopped
    environment:
      # Solo para el healthcheck de acá abajo (fs_cli necesita loguearse).
      # El valor real que manda FreeSWITCH sigue siendo el de
      # event_socket.conf.xml — este debe coincidir con ese, no lo
      # reemplaza.
      FS_ESL_PASSWORD: ${FS_ESL_PASSWORD:?Definí FS_ESL_PASSWORD en .env}
    volumes:
      - ./freeswitch/conf:/etc/freeswitch
      - ./freeswitch/sounds:/usr/share/freeswitch/sounds
      - ./freeswitch/recordings:/var/lib/freeswitch/recordings
      - fs_scripts:/usr/share/freeswitch/scripts
      # El certificado del WebSocket seguro (wss.pem) NO puede vivir solo
      # dentro del contenedor: FreeSWITCH lo autogenera si no lo
      # encuentra, así que sin este volumen cada reconstrucción del
      # contenedor generaba uno NUEVO — y cualquier navegador que ya
      # hubiera aceptado el certificado anterior tenía que volver a
      # aceptar el nuevo. Con esto, el mismo certificado sobrevive entre
      # despliegues.
      - ./freeswitch/certs:/usr/local/freeswitch/certs
    # NOTA: se probó network_mode: host para evitar el NAT de Docker en el
    # tráfico UDP, pero en Docker Desktop con backend WSL2 eso comparte la
    # red de la VM de WSL2, NO la de Windows — ni el navegador ni el resto
    # de contenedores pueden alcanzarlo así. Revertido a bridge + puertos
    # publicados (que sí son accesibles vía localhost gracias al proxy de
    # Docker Desktop).
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      # Señalización SIP saliente (perfil "external"). En 15080 y no en
      # el 5080 clásico para esquivar el SIP ALG de los firewalls
      # corporativos, que reescribe el tráfico SIP de los puertos
      # conocidos y rompe el registro: comprobado con tcpdump — el
      # REGISTER salía y jamás volvía respuesta, y al mover el puerto
      # registró al instante. Tiene que coincidir con
      # external_sip_port de freeswitch/conf/vars.xml.
      - "15080:15080/udp"
      # 8021 (ESL) NO se publica al host: es el socket de control que
      # permite originar llamadas, leer canales y ejecutar comandos —
      # con la contraseña de fábrica ("ClueCon") es el vector de fraude
      # telefónico más buscado por escáneres automatizados de internet.
      # Solo lo necesita el backend, que lo alcanza por la red interna
      # de Docker (nspbx_net) sin que este puerto exista en el host.
      # Para inspeccionarlo a mano en desarrollo: `docker exec -it
      # nspbx_freeswitch fs_cli` (corre DENTRO del contenedor, no necesita
      # el puerto publicado).
      # Solo loopback: publicados en 0.0.0.0 daban acceso directo desde Internet al
      # registro SIP (fuerza bruta de contraseñas) sin pasar por el proxy. En
      # producción el softphone entra por Traefik (/sip -> nspbx_freeswitch:7443).
      - "127.0.0.1:5066:5066"   # SIP sobre WebSocket sin cifrar (solo desarrollo local)
      - "127.0.0.1:7443:7443"   # SIP sobre WebSocket CIFRADO (wss://); Traefik lo alcanza por la red interna
      # El softphone del navegador entra por ACÁ, no por Traefik. Con el
      # proxy en el medio NO SE PUEDE LLAMAR a un softphone web: sofia
      # guarda como ruta de vuelta el puerto de ORIGEN efímero de Traefik,
      # y al mandarle el INVITE tport_by_addrinfo no reconoce ese socket e
      # intenta CONECTARSE a ese puerto, donde no escucha nadie. El INVITE
      # queda encolado y no se transmite nunca —ni aparece en `sofia global
      # siptrace on`—; el que llama solo ve un 408 a los 32 s. El registro
      # funciona igual, porque responder usa la conexión entrante y no
      # necesita buscar ninguna ruta: por eso el síntoma es "registra
      # perfecto pero las llamadas internas mueren".
      #
      # Expuesto directo, sofia ve el socket REAL del navegador y el INVITE
      # sale. Requiere el puerto abierto en el router hacia este host y un
      # certificado válido en freeswitch/certs/wss.pem para el nombre que
      # use el navegador (ver scripts/renovar-cert-wss.sh).
      #
      # 8443 y no 7443 a propósito: 5060 y 5061 están en la lista de
      # puertos que Chrome bloquea, y conviene separar el número público
      # del interno. Contrapartida a tener en cuenta: en redes corporativas
      # restrictivas puede no pasar, a diferencia del 443.
      - "8443:7443"
      - "16384-16584:16384-16584/udp"  # RTP (audio WebRTC del softphone)
    labels:
      - "traefik.enable=true"
      # El softphone del navegador entra por wss://PBX_HOST/sip. Traefik
      # termina el TLS y reenvía al ws SIN cifrar de FreeSWITCH (5066),
      # no al 7443: si fuera al 7443 habría doble TLS y encima con el
      # certificado autofirmado que FreeSWITCH se genera solo, que el
      # navegador rechaza. Con esto el softphone usa el mismo
      # certificado válido del panel.
      - "traefik.http.routers.sipws.rule=Host(`${PBX_HOST:-pbx.localhost}`) && PathPrefix(`/sip`)"
      - "traefik.http.routers.sipws.entrypoints=websecure"
      - "traefik.http.routers.sipws.tls.certresolver=${ACME_RESOLVER:-mi-resuelves-ssl}"
      # mod_sofia escucha en ":5066" sin path fijo, así que se le quita
      # el /sip antes de reenviar y la conexión le llega en la raíz.
      - "traefik.http.routers.sipws.middlewares=sip-strip"
      - "traefik.http.middlewares.sip-strip.stripprefix.prefixes=/sip"
      - "traefik.http.services.sipws.loadbalancer.server.port=5066"
      - "traefik.docker.network=traefik-public"
    depends_on:
      backend:
        condition: service_healthy
      voicebot:
        condition: service_healthy
    healthcheck:
      # No usa 127.0.0.1: event_socket.conf.xml ata el ESL a la IP real del
      # contenedor ($${local_ip_v4}), no a loopback (ver ese archivo para
      # el motivo).
      #
      # Se prueban TODAS las IPs y no "hostname -i" a secas: al sumar el
      # contenedor a traefik-public quedó en dos redes y ese comando pasó
      # a devolver las dos direcciones separadas por espacio, con lo que
      # fs_cli recibía un -H malformado y el contenedor quedaba unhealthy
      # con FreeSWITCH funcionando perfecto. Tomar la primera tampoco
      # sirve: local_ip_v4 puede ser cualquiera de las dos (acá es la
      # segunda). El bucle corta en la que conteste.
      test: ["CMD-SHELL", "for ip in $$(hostname -i); do fs_cli -H $$ip -P 8021 -p \"$$FS_ESL_PASSWORD\" -x status 2>/dev/null | grep -q 'is ready' && exit 0; done; exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - nspbx_net
      # Traefik (el de Dokploy) vive en esta red y solo alcanza a los
      # contenedores que estén en ella.
      - traefik-public

  backend:
    build: ./backend
    image: nspbx-backend:latest
    container_name: nspbx_backend
    logging: *logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nspbx}:${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env (bash scripts/setup.sh lo genera)}@postgres:5432/${POSTGRES_DB:-nspbx}
      # Rol restringido con el que se atiende la operación normal. Es lo
      # que hace que el aislamiento por empresa (RLS) se aplique de
      # verdad: el usuario de arriba es dueño de las tablas y se saltea
      # las políticas. Sin esta variable el backend arranca igual, avisa
      # por log y NO aísla nada — ver app/core/database.py.
      DATABASE_URL_APP: postgresql+asyncpg://nspbx_app:${POSTGRES_APP_PASSWORD:?Definí POSTGRES_APP_PASSWORD en .env porque sin él el aislamiento por empresa queda apagado}@postgres:5432/${POSTGRES_DB:-nspbx}
      FS_ESL_HOST: freeswitch
      FS_ESL_PORT: "8021"
      # Sin valor de respaldo a propósito: `:?` hace que falle el arranque
      # si falta en .env, en vez de reseedear la contraseña de fábrica
      # "ClueCon" —o peor, una vacía— en una instalación nueva.
      FS_ESL_PASSWORD: ${FS_ESL_PASSWORD:?Definí FS_ESL_PASSWORD en .env — ver freeswitch/conf/autoload_configs/event_socket.conf.xml}
      FS_HTTP_BASE: http://freeswitch:8080
      FS_CONF_DIR: /freeswitch-conf
      FS_SOUNDS_DIR: /freeswitch-sounds
      # Debe coincidir con el ?secret= de freeswitch/conf/autoload_configs/xml_curl.conf.xml.
      FS_XML_SECRET: ${FS_XML_SECRET:?Definí FS_XML_SECRET en .env — ver freeswitch/conf/autoload_configs/xml_curl.conf.xml}
      # Firma los tokens de sesión. Si falta, el backend genera una clave
      # al azar en cada arranque y todo el mundo queda desconectado al
      # reiniciar. Se define en .env, nunca acá con un valor por defecto:
      # una clave fija en el repositorio deja firmar tokens de admin a
      # cualquiera que lo lea.
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Solo se usa la primera vez, para crear el usuario "admin". Si se
      # deja vacío, la contraseña se genera y sale en el log del arranque.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Relay de audio. El mismo secreto que recibe coturn: con él el
      # backend firma credenciales que caducan, en vez de repartir una
      # contraseña fija. Vacío = sin relay, el softphone usa solo STUN.
      TURN_SECRET: ${TURN_SECRET:-}
      # Dominio por el que el NAVEGADOR alcanza el relay. Va aparte de
      # PBX_HOST porque en el DNS tienen que ser distintos: este NO puede
      # estar detrás del proxy de Cloudflare (ver .env.example).
      TURN_HOST: ${TURN_HOST:-}
      # Push de voz a la app móvil (ver mobile/SETUP.md). Vacío = push
      # desactivado: la app sigue sirviendo con ella abierta, solo no
      # despierta en segundo plano (app/services/push.py).
      # Topes de la PLATAFORMA (ver backend/app/core/alcance.py). Con varias
      # empresas ninguna puede fijarlos desde el panel; con una sola, sus Ajustes
      # tienen prioridad sobre estos valores.
      RECORDINGS_MAX_GB: ${RECORDINGS_MAX_GB:-20}
      BACKUPS_MAX_GB: ${BACKUPS_MAX_GB:-5}
      MAX_CONCURRENT_CALLS_GLOBAL: ${MAX_CONCURRENT_CALLS_GLOBAL:-200}
      PERMITIR_URLS_PRIVADAS: ${PERMITIR_URLS_PRIVADAS:-false}
      PROXIES_CONFIABLES: ${PROXIES_CONFIABLES:-1}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_AUTH_KEY: ${APNS_AUTH_KEY:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_USE_SANDBOX: ${APNS_USE_SANDBOX:-false}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      # Alternativa cómoda al JSON en una variable: la ruta DENTRO del contenedor del archivo de la
      # cuenta de servicio (se monta abajo desde ./secrets). Ej.: FCM_SERVICE_ACCOUNT_FILE=/run/secrets/fcm.json
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
    volumes:
      - ./freeswitch/conf:/freeswitch-conf
      - ./freeswitch/sounds:/freeswitch-sounds
      - ./freeswitch/recordings:/freeswitch-recordings
      # Carpeta del host y no un volumen con nombre a propósito: son
      # archivos .sql.gz comunes, y así se pueden copiar a un disco
      # externo o a otra máquina sin pasar por Docker para nada — la
      # respuesta real a "¿y si se pierde este servidor entero?".
      - ./backups:/backups
      - ./secrets:/run/secrets:ro
    ports:
      # Atado a 127.0.0.1 y NO a 0.0.0.0: la API queda accesible solo
      # desde este mismo servidor. Sin el prefijo, Docker publica en
      # todas las interfaces y cualquiera en la red podía llegarle —
      # lo que convertía en explotable el /fs/cdr que estaba sin
      # secreto (ver app/api/calls.py). FreeSWITCH NO usa este puerto:
      # le habla al backend por la red interna de Docker (backend:8000),
      # así que esto no afecta CDR, dialplan ni directorio.
      # El acceso desde afuera entra por Traefik (labels de abajo); esto
      # queda para diagnosticar la API sin pasar por el proxy.
      - "127.0.0.1:8001:8000"
    labels:
      - "traefik.enable=true"
      # Solo /api y /ws salen a internet. /fs/* (directory, dialplan,
      # cdr) queda DELIBERADAMENTE fuera: lo consume FreeSWITCH por la
      # red interna de Docker, y aunque lleva secreto compartido, no hay
      # ninguna razón para que sea alcanzable desde internet. Al no
      # tener router, cae en el catch-all del panel y devuelve 404.
      - "traefik.http.routers.api.rule=Host(`${PBX_HOST:-pbx.localhost}`) && (PathPrefix(`/api`) || PathPrefix(`/ws`))"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=${ACME_RESOLVER:-mi-resuelves-ssl}"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      - "traefik.docker.network=traefik-public"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Sin curl: se purga de esta imagen después de instalar pg_dump (ver
      # backend/Dockerfile) para no dejarlo de regalo en la imagen final.
      # Python ya está — es la propia app.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - nspbx_net
      # Traefik (el de Dokploy) vive en esta red y solo alcanza a los
      # contenedores que estén en ella.
      - traefik-public

  # Pipeline de IA en vivo (control de llamada por ESL outbound socket +
  # streaming de audio) — ver app/voicebot_server.py para el porqué de
  # separarlo del backend. Misma imagen que "backend" (mismo Dockerfile,
  # mismo código), solo cambia el comando que arranca.
  voicebot:
    # Mismo código e imagen que "backend" (mismo Dockerfile, mismo
    # contexto): un solo build, dos contenedores, cada uno arrancando un
    # comando distinto. El segundo build sale de caché al instante.
    #
    # El `build:` es necesario aunque parezca redundante: sin él, en una
    # máquina donde la imagen todavía no existe, compose intenta
    # DESCARGARLA de Docker Hub y falla con "pull access denied" —
    # nspbx-backend es local, no está publicada en ningún registro. En
    # el equipo de desarrollo no se notaba porque la imagen ya estaba
    # construida de antes.
    build: ./backend
    image: nspbx-backend:latest
    container_name: nspbx_voicebot
    logging: *logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command: ["uvicorn", "app.voicebot_server:app", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nspbx}:${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env (bash scripts/setup.sh lo genera)}@postgres:5432/${POSTGRES_DB:-nspbx}
      # Rol restringido con el que se atiende la operación normal. Es lo
      # que hace que el aislamiento por empresa (RLS) se aplique de
      # verdad: el usuario de arriba es dueño de las tablas y se saltea
      # las políticas. Sin esta variable el backend arranca igual, avisa
      # por log y NO aísla nada — ver app/core/database.py.
      DATABASE_URL_APP: postgresql+asyncpg://nspbx_app:${POSTGRES_APP_PASSWORD:?Definí POSTGRES_APP_PASSWORD en .env porque sin él el aislamiento por empresa queda apagado}@postgres:5432/${POSTGRES_DB:-nspbx}
      FS_SOUNDS_DIR: /freeswitch-sounds
    volumes:
      # Solo el de sonidos: acá se escribe el audio de "tecleo" y las
      # frases sintetizadas por turno, y FreeSWITCH necesita poder leerlas
      # de vuelta (por eso comparte carpeta con el propio FreeSWITCH). No
      # necesita conf/ ni recordings/: no toca el dialplan ni graba nada.
      - ./freeswitch/sounds:/freeswitch-sounds
    # Sin "ports": ni el socket ESL (8085) ni el websocket de audio (8090)
    # se publican al host — igual que el ESL de FreeSWITCH (puerto 8021):
    # son canales de control interno, solo FreeSWITCH necesita hablarles,
    # y lo hace por la red interna de Docker.
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - nspbx_net

  frontend:
    build: ./frontend
    container_name: nspbx_frontend
    logging: *logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      # Solo desde este servidor. Con Traefik delante ya no hace falta
      # publicarlo para el acceso normal (Traefik le habla por la red
      # interna de Docker); se deja para poder diagnosticar el panel sin
      # depender del proxy ni del DNS.
      - "127.0.0.1:3005:3000"
    labels:
      - "traefik.enable=true"
      # Router "catch-all" del dominio: agarra todo lo que no matchearon
      # los routers de mayor prioridad (API y softphone, abajo). Traefik
      # ordena por longitud de regla, así que los de path van primero.
      - "traefik.http.routers.panel.rule=Host(`${PBX_HOST:-pbx.localhost}`)"
      - "traefik.http.routers.panel.entrypoints=websecure"
      - "traefik.http.routers.panel.tls.certresolver=${ACME_RESOLVER:-mi-resuelves-ssl}"
      - "traefik.http.services.panel.loadbalancer.server.port=3000"
      # Imprescindible: este contenedor está en DOS redes (la interna y
      # la de Traefik). Sin decirle cuál usar, Traefik puede quedarse con
      # la IP de nspbx_net, a la que no tiene ruta, y el sitio responde
      # 502 sin ninguna pista del motivo.
      - "traefik.docker.network=traefik-public"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - nspbx_net
      # Traefik (el de Dokploy) vive en esta red y solo alcanza a los
      # contenedores que estén en ella.
      - traefik-public

  # Relay de audio para el softphone del navegador. Solo hace falta
  # cuando la red del usuario no deja pasar el UDP del RTP — que es lo
  # habitual fuera de una LAN: oficinas de clientes, hoteles, datos
  # móviles y redes corporativas suelen abrir 80 y 443 y nada más.
  # Sin relay la llamada conecta y se queda muda, que es el síntoma más
  # confuso posible porque la señalización funciona perfecto.
  #
  # Se activa solo si TURN_SECRET tiene valor; sin eso el backend manda
  # únicamente STUN y el audio va directo (ver app/services/turn.py).
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: nspbx_coturn
    logging: *logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # No arranca con un `docker compose up` normal: hay que pedirlo con
    # `docker compose --profile turn up -d`. Sin esto quedaba levantado
    # aunque TURN_SECRET estuviera vacío — un contenedor consumiendo
    # recursos sin hacer nada, y peor, dando la impresión de que el
    # relay está activo cuando no lo está.
    profiles: ["turn"]
    # NO publica ningún puerto, a propósito. El navegador entra por el
    # 443 de Traefik (que ya está abierto) y Traefik le habla a este
    # contenedor por la red de Docker; el audio relayado sale hacia
    # FreeSWITCH por la red interna. Nada de esto necesita que el
    # firewall abra un puerto nuevo, que es justamente el motivo de
    # existir del relay.
    command:
      - -n                                   # sin archivo de config: todo acá
      - --log-file=stdout
      - --listening-port=3478                # TURN en claro; el TLS lo pone Traefik
      - --fingerprint
      - --use-auth-secret                     # sin base de usuarios: valida firmas
      - --static-auth-secret=${TURN_SECRET:-}
      - --realm=${PBX_HOST:-pbx.localhost}
      # Rango de puertos del relay. Son internos (coturn -> FreeSWITCH),
      # así que no se publican ni hay que abrirlos: cada llamada usa uno.
      - --min-port=49160
      - --max-port=49260
      # Endurecimiento: sin multicast ni loopback como destino, para que
      # nadie use el relay para alcanzar servicios internos del servidor.
      - --no-multicast-peers
      - --denied-peer-ip=127.0.0.1
      # Redes privadas y link-local (incluye 169.254.169.254, el servicio de
      # metadatos de la nube, que entrega credenciales). NO se veta 172.16/12
      # porque es donde vive FreeSWITCH en la red de Docker, el destino real del
      # relay. Cerrar también ese rango exige fijar la subred de nspbx_net y
      # permitir solo la IP de FreeSWITCH (--allowed-peer-ip).
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      # Tope de asignaciones por usuario y en total: sin esto, una credencial
      # TURN válida puede agotar los puertos del relay.
      - --user-quota=12
      - --total-quota=1000
      - --no-cli
      - --no-tlsv1
      - --no-tlsv1_1
    healthcheck:
      test: ["CMD-SHELL", "netstat -tln | grep -q ':3478 '"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      # nspbx_net para entregarle el audio a FreeSWITCH.
      - nspbx_net
      # traefik-public para que Traefik pueda alcanzarlo.
      - traefik-public

volumes:
  pg_data:
  fs_scripts:

networks:
  # Red interna del stack: postgres, backend, voicebot y freeswitch se
  # hablan por acá y nada de esto sale a internet.
  nspbx_net:
    driver: bridge

  # Red del Traefik que ya existe en el servidor (el de Dokploy). Es
  # `external` porque NO la crea este compose: la crea Dokploy, y este
  # stack solo se engancha. Si no existe, `docker compose up` falla con
  # un mensaje claro en vez de levantar algo inalcanzable.
  #
  # Este stack NO trae su propio Traefik a propósito: 80 y 443 ya tienen
  # dueño en ese servidor, y dos Traefik peleando por los mismos puertos
  # es el clásico "uno arranca y el otro queda reiniciándose".
  traefik-public:
    external: true
