# Filtro para el escaneo de fraude telefónico, que el filtro
# nspbx-freeswitch NO puede ver.
#
# Aquel cuenta "SIP auth failure": el atacante manda credenciales y falla.
# Pero el escáner de fraude no llega a eso — manda un INVITE, recibe el
# desafío de autenticación y NUNCA responde. Sin segundo intento no hay
# línea de "failure", así que puede insistir indefinidamente sin que nada
# lo cuente. Medido en producción el 2026-09-23: 256 intentos en pocos
# minutos desde dos IPs, ninguna bloqueada.
#
# La señal que sí los delata es el DOMINIO al que apuntan. Un teléfono
# legítimo autentica siempre contra el dominio de su empresa
# (empresa1.pbx.local); el escáner no lo conoce y usa la IP del servidor:
#
#   SIP auth challenge (INVITE) on sofia profile 'internal'
#     for [9011525598160169@152.202.123.196] from ip 84.32.32.32
#
# Ese 9011525598160169 es el destino que intentan: 011 = salida
# internacional, 52 = México. Prueban variantes de prefijo hasta dar con
# una que la central acepte, y si una extensión tiene contraseña débil la
# llamada sale y la paga el dueño de la central.
#
# Por eso el filtro exige que la parte del dominio sea una IPv4: nadie
# legítimo se registra así, y el falso positivo queda descartado por
# construcción en vez de por umbral.

[Definition]
failregex = ^.*SIP auth (?:challenge|failure) \((?:REGISTER|INVITE|OPTIONS)\) on sofia profile '[^']+' for \[[^\]]*@(?:\d{1,3}\.){3}\d{1,3}\] from ip <HOST>

ignoreregex =
