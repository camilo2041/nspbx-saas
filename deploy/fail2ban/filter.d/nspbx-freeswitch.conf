# Filtro fail2ban para los intentos fallidos de registro/llamada SIP en
# FreeSWITCH. Requiere `log-auth-failures=true` en sip_profiles/internal.xml
# (ya viene activado); sin eso FreeSWITCH no escribe estas líneas.
#
# Líneas que reconoce (dentro del JSON que Docker guarda de cada contenedor):
#   [WARNING] sofia_reg.c:1902 SIP auth failure (REGISTER) on sofia profile
#   'internal' for [1000@empresa.pbx.local] from ip 203.0.113.9
#
# Solo "failure". "challenge" NO se cuenta: FreeSWITCH lo emite en CADA
# registro legítimo (primero desafía, luego el teléfono contesta con la
# credencial), así que bloquearía a usuarios que tienen todo bien puesto.
# Los sondeos que nunca contestan el desafío no aparecen como failure; los
# cubre el resto de defensas (destinos limitados, topes, contraseñas fuertes).

[Definition]
failregex = SIP auth failure \((?:REGISTER|INVITE|OPTIONS)\) on sofia profile '[^']+' for \[[^\]]*\] from ip <HOST>

ignoreregex =
