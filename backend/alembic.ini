# Solo para la línea de comandos (alembic revision / upgrade / history).
# El backend aplica las migraciones solo al arrancar (app/main.migrar), sin
# usar este archivo. Conecta con DATABASE_URL (rol dueño).
[alembic]
script_location = app/migraciones
version_locations = app/migraciones/versiones
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = consola

[formatters]
keys = simple

[logger_root]
level = WARNING
handlers = consola

[handler_consola]
class = StreamHandler
args = (sys.stderr,)
formatter = simple

[formatter_simple]
format = %(levelname)s %(name)s: %(message)s
