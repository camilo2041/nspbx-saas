[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
# Un solo event loop para toda la corrida: los motores de SQLAlchemy son
# globales del módulo app.core.database y sus conexiones de asyncpg quedan
# atadas al loop donde se abrieron.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning
